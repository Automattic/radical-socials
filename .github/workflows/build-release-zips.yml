name: Build Release Zips

# Builds distributable zips of the plugin and the theme using the same
# build scripts we run locally (npm run plugin-zip / theme-zip), then —
# when triggered by a version tag — publishes them as a GitHub Release,
# the way Gutenberg attaches gutenberg.zip to each release.
#
# The plugin and the theme version independently, so they release
# independently via tag prefixes:
#
#   * Push `plugin-v1.2.0` → builds AND releases the plugin zip only.
#   * Push `theme-v2.0.1`  → builds AND releases the theme zip only.
#   * Run manually (Actions tab → "Run workflow") and pick a target →
#     builds the chosen zip(s) and uploads them as workflow artifacts,
#     without cutting a release.
#
# The version in the tag must match the version in the component's header
# (the plugin PHP header / the theme style.css), otherwise the run fails
# before publishing — this keeps the Release name and the zip filename in
# sync and catches mistyped tags.

on:
  push:
    tags:
      - 'plugin-v*'
      - 'theme-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which zip(s) to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - plugin
          - theme

# Needed so the workflow can create the Release and upload assets.
permissions:
  contents: write

jobs:
  # Work out, from the trigger, which component(s) to build and whether to
  # publish a release. One place for the branching so the build job stays
  # simple.
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      build_plugin: ${{ steps.decide.outputs.build_plugin }}
      build_theme: ${{ steps.decide.outputs.build_theme }}
      release_component: ${{ steps.decide.outputs.release_component }}
    steps:
      - name: Decide what to build and release
        id: decide
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          BUILD_PLUGIN=false
          BUILD_THEME=false
          RELEASE_COMPONENT=""

          if [[ "$IS_TAG" == "true" ]]; then
            # Tag push → build and release exactly the tagged component.
            case "$REF_NAME" in
              plugin-v*) BUILD_PLUGIN=true; RELEASE_COMPONENT=plugin ;;
              theme-v*)  BUILD_THEME=true;  RELEASE_COMPONENT=theme  ;;
              *) echo "Unrecognised tag: $REF_NAME" >&2; exit 1 ;;
            esac
          else
            # Manual run → build the chosen target, never release.
            case "$TARGET" in
              plugin) BUILD_PLUGIN=true ;;
              theme)  BUILD_THEME=true ;;
              both|"") BUILD_PLUGIN=true; BUILD_THEME=true ;;
              *) echo "Unrecognised target: $TARGET" >&2; exit 1 ;;
            esac
          fi

          {
            echo "build_plugin=$BUILD_PLUGIN"
            echo "build_theme=$BUILD_THEME"
            echo "release_component=$RELEASE_COMPONENT"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build zips
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # plugin-zip also runs `npm run build` and `npm run build:templates`
      # (PHP is preinstalled on ubuntu-latest), so this matches exactly what
      # we build locally.
      - name: Build plugin zip
        if: needs.resolve.outputs.build_plugin == 'true'
        run: npm run plugin-zip

      - name: Build theme zip
        if: needs.resolve.outputs.build_theme == 'true'
        run: npm run theme-zip

      # On a tag, make sure the version in the tag matches the version baked
      # into the zip filename, so the Release name and asset never drift.
      - name: Verify tag matches component version
        if: needs.resolve.outputs.release_component != ''
        env:
          REF_NAME: ${{ github.ref_name }}
          COMPONENT: ${{ needs.resolve.outputs.release_component }}
        run: |
          if [[ "$COMPONENT" == "plugin" ]]; then
            TAG_VERSION="${REF_NAME#plugin-v}"
            EXPECTED="dist/radical-socials-tools-${TAG_VERSION}.zip"
          else
            TAG_VERSION="${REF_NAME#theme-v}"
            EXPECTED="dist/radical-theme-${TAG_VERSION}.zip"
          fi
          if [[ ! -f "$EXPECTED" ]]; then
            echo "Tag $REF_NAME implies $EXPECTED, but it was not produced." >&2
            echo "The version in the tag must match the component's header version." >&2
            echo "Produced files:" >&2
            ls -1 dist/*.zip >&2 || true
            exit 1
          fi

      # Always keep the zips as artifacts — useful for manual runs and as a
      # record on tag runs even if the release step is skipped.
      - name: Upload zips as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radical-socials-zips
          path: dist/*.zip
          if-no-files-found: error

      # On a version tag: publish a GitHub Release with just that
      # component's zip attached, so it shows up under Releases like
      # Gutenberg's do. The plugin and theme each get their own release.
      - name: Create GitHub Release
        if: needs.resolve.outputs.release_component != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: dist/*.zip
